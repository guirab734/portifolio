<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="title desc">
<title id="title">Supino reto com halteres</title>
<desc id="desc">Duas vistas de lado de uma pessoa deitada em banco horizontal, pés apoiados no chão e um halter em cada mão. No início, os cotovelos estão flexionados e os halteres próximos à linha do peito. No fim, os braços estão estendidos acima do peito, mantendo os ombros apoiados no banco. Desça com controle, sem bater os halteres nem forçar uma amplitude desconfortável.</desc>
