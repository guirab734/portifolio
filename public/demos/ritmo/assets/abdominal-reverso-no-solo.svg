<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="title desc">
<title id="title">Abdominal reverso no solo com joelhos flexionados</title>
<desc id="desc">Duas vistas laterais de uma pessoa deitada de costas em um colchonete, cabeça e ombros no chão e braços ao lado do corpo. Na posição inicial, os quadris e os joelhos estão flexionados, com os pés suspensos. Em seguida, a pessoa aproxima a pelve das costelas e eleva o quadril apenas um pouco, enrolando a parte baixa da coluna com controle. Os joelhos continuam flexionados. A cabeça, os ombros e os braços permanecem apoiados, sem embalo nem rolar sobre o pescoço.</desc>
